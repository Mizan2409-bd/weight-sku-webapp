services:
  - type: web
    name: weight-sku-management
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: weight-sku-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: weight-sku-db
    plan: basic
