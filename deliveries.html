{% extends "base.html" %}{% block content %}<h1>Delivery Entry</h1><div class="card"><form method="post" action="/deliveries/add" class="formgrid"><input name="delivery_date" type="date" required><input name="truck_no" placeholder="Truck Number" required><input name="party_name" placeholder="Party Name"><input name="material_code" placeholder="Material Code" required><input name="description" placeholder="Description"><input name="qty" type="number" step="0.01" placeholder="Qty" required><input name="mt" type="number" step="0.001" placeholder="MT" required><button>Save Delivery</button></form></div><div class="card tablewrap"><table><tr><th>Date</th><th>Truck</th><th>Party</th><th>Material</th><th>Description</th><th>Qty</th><th>MT</th><th>Entered By</th></tr>{% for r in rows %}<tr><td>{{r.delivery_date}}</td><td>{{r.truck_no}}</td><td>{{r.party_name}}</td><td>{{r.material_code}}</td><td>{{r.description}}</td><td>{{r.qty}}</td><td>{{r.mt}}</td><td>{{r.entered_by}}</td></tr>{% endfor %}</table></div>{% endblock %}
