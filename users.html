{% extends "base.html" %}{% block content %}<h1>User Management</h1><div class="card"><form method="post" class="formgrid"><input name="username" placeholder="New username" required><input name="password" type="password" placeholder="Temporary password" required><select name="role"><option value="user">User</option><option value="admin">Admin</option></select><button>Create User</button></form></div><div class="card"><table><tr><th>Username</th><th>Role</th><th>Active</th></tr>{% for u in users %}<tr><td>{{u.username}}</td><td>{{u.role}}</td><td>{{u.active}}</td></tr>{% endfor %}</table></div>{% endblock %}
